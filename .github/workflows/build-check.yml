name: Build check (no push)

# Proves the Go code compiles and the Docker image builds (including the
# Audiveris installDist step) on every branch, without needing registry
# secrets. The image is not pushed anywhere; Railway builds its own from
# the Dockerfile.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Go build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Docker image builds
        run: docker build -t audiforge-check:ci .
      - name: Launcher is present in the image
        run: docker run --rm --entrypoint sh audiforge-check:ci -c 'test -x /usr/local/bin/audiveris && cat /usr/local/bin/audiveris | head -20'
